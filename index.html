/* =========================================================
   TRACKING
   Envie os cliques para o Google Analytics (GA4) assim que o
   Measurement ID estiver configurado — ver nota ao final do arquivo.
========================================================= */
function trackOrcamento(productName, variationLabel, price){
  const payload = {
    event: "solicitar_orcamento",
    product_name: productName,
    variation: variationLabel,
    price: price
  };
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push(payload);
  if (typeof gtag === "function"){
    gtag("event", "solicitar_orcamento", {
      item_name: productName,
      item_variant: variationLabel,
      value: price,
      currency: "BRL"
    });
  }
  console.log("[track] solicitar_orcamento", payload);
}

function slug(str){
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}
function fmtBRL(n){
  return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function codeFor(catIndex, itemIndex){
  const cat = CATALOG[catIndex].category.replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,3) || "ZNX";
  return `ZNX-${cat}${String(itemIndex+1).padStart(2,"0")}`;
}
function lowestPrice(item){
  return Math.min(...item.variations.map(v=>v.cash));
}
function waLink(productName, variationLabel){
  const msg = `Olá, vim do Instagram e quero orçamento do ${productName} ${variationLabel}`;
  return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
}

/* =========================================================
   RENDER
========================================================= */
const main = document.getElementById("main");
const catnav = document.getElementById("catnav");
const resultCount = document.getElementById("resultCount");
const emptyState = document.getElementById("emptyState");

function renderNav(){
CATALOG.forEach((cat, ci)=>{
  const a = document.createElement("a");
  a.href = `#cat-${slug(cat.category)}`;
  a.textContent = cat.category;
  catnav.appendChild(a);
});
}

function buildCard(item, ci, ii){
  const card = document.createElement("article");
  card.className = "card";
  card.dataset.name = item.name.toLowerCase();
  card.dataset.price = lowestPrice(item);

  const stub = document.createElement("div");
  stub.className = "stub";
  stub.innerHTML = "";

  const body = document.createElement("div");
  body.className = "body";

  const thumb = document.createElement("div");
  thumb.className = "thumb";
  thumb.textContent = `+ FOTO — ${item.name}`;

  const badges = document.createElement("div");
  badges.className = "badges";
  if (item.badge){
    const b = document.createElement("span");
    b.className = "badge " + (item.badge === "NOVO" ? "novo" : "seminovo");
    b.textContent = item.badge;
    badges.appendChild(b);
  }

  const h3 = document.createElement("h3");
  h3.textContent = item.name;

  let specEl = null;
  if (item.spec){
    specEl = document.createElement("p");
    specEl.className = "spec";
    specEl.textContent = item.spec;
  }

  const variationsWrap = document.createElement("div");
  variationsWrap.className = "variations";

  const priceBlock = document.createElement("div");
  priceBlock.className = "price-block";
  const priceCash = document.createElement("div");
  priceCash.className = "price-cash mono";
  const priceInstall = document.createElement("div");
  priceInstall.className = "price-install";

  const cta = document.createElement("a");
  cta.className = "cta";
  cta.target = "_blank";
  cta.rel = "noopener";
  cta.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.5-.1-.6.1-.2.3-.7.9-.9 1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.1.2-.3.2-.4.1-.1 0-.3 0-.4-.1-.1-.6-1.5-.8-2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.1 0 1.2.9 2.4 1 2.6.1.2 1.8 2.8 4.4 3.9.6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.7 1.5 5.3L2 22l4.8-1.5c1.5.8 3.3 1.3 5.2 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.2c-1.7 0-3.4-.5-4.8-1.4l-.3-.2-3.2 1 1-3.1-.2-.3C3.5 14.8 3 13.4 3 12c0-5 4-9 9-9s9 4 9 9-4 9-9 9.2z"/></svg><span class="cta-label">Solicitar orçamento no WhatsApp</span>`;

  let currentIndex = 0;

  function updatePrice(){
    const v = item.variations[currentIndex];
    priceCash.textContent = "R$ " + fmtBRL(v.cash);
    priceInstall.textContent = `ou 12x de R$ ${fmtBRL(v.inst)}`;
    cta.href = waLink(item.name, v.label);
    cta.onclick = ()=> trackOrcamento(item.name, v.label, v.cash);
  }

  if (item.variations.length > 1){
    item.variations.forEach((v, vi)=>{
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = v.label;
      if (vi === 0) btn.classList.add("active");
      btn.addEventListener("click", ()=>{
        currentIndex = vi;
        variationsWrap.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        updatePrice();
      });
      variationsWrap.appendChild(btn);
    });
  }

  updatePrice();

  priceBlock.appendChild(priceCash);
  priceBlock.appendChild(priceInstall);

  body.appendChild(thumb);
  if (badges.childElementCount) body.appendChild(badges);
  body.appendChild(h3);
  if (specEl) body.appendChild(specEl);
  if (item.variations.length > 1) body.appendChild(variationsWrap);
  body.appendChild(priceBlock);
  body.appendChild(cta);

  card.appendChild(stub);
  card.appendChild(body);
  return card;
}

function renderSections(){
CATALOG.forEach((cat, ci)=>{
  const section = document.createElement("section");
  section.className = "category-section";
  section.id = `cat-${slug(cat.category)}`;

  const head = document.createElement("div");
  head.className = "cat-head";
  head.innerHTML = `<h2>${cat.category}</h2><span class="cat-count mono">${cat.items.length} ${cat.items.length===1?"item":"itens"}</span>`;

  const grid = document.createElement("div");
  grid.className = "grid";
  cat.items.forEach((item, ii)=> grid.appendChild(buildCard(item, ci, ii)));

  section.appendChild(head);
  section.appendChild(grid);
  main.appendChild(section);
});
}

/* =========================================================
   FILTER / SEARCH
========================================================= */
const searchInput = document.getElementById("searchInput");
const priceFilter = document.getElementById("priceFilter");
const allCards = ()=> Array.from(document.querySelectorAll(".card"));
const allSections = ()=> Array.from(document.querySelectorAll(".category-section"));

function applyFilters(){
  const term = searchInput.value.trim().toLowerCase();
  const range = priceFilter.value;
  let [min, max] = range === "all" ? [0, Infinity] : range.split("-").map(Number);

  let visibleTotal = 0;

  allSections().forEach(section=>{
    let visibleInSection = 0;
    section.querySelectorAll(".card").forEach(card=>{
      const nameMatch = !term || card.dataset.name.includes(term);
      const price = Number(card.dataset.price);
      const priceMatch = price >= min && price <= max;
      const show = nameMatch && priceMatch;
      card.style.display = show ? "" : "none";
      if (show){ visibleInSection++; visibleTotal++; }
    });
    section.style.display = visibleInSection ? "" : "none";
  });

  resultCount.textContent = `${visibleTotal} produto${visibleTotal===1?"":"s"} encontrado${visibleTotal===1?"":"s"}`;
  emptyState.style.display = visibleTotal === 0 ? "block" : "none";
}

searchInput.addEventListener("input", applyFilters);
priceFilter.addEventListener("change", applyFilters);

/* =========================================================
   CARREGAMENTO DO CATÁLOGO
   Tenta buscar catalogo-zeneex.json (fonte compartilhada com
   o Catálogo PDF). Se falhar — por exemplo, página aberta
   direto do disco sem servidor — usa o CATALOG_FALLBACK
   embutido acima, para o site nunca ficar vazio.
========================================================= */
function startCatalog(){
  renderNav();
  renderSections();
  applyFilters();
}

fetch(CATALOG_JSON_URL, {cache:"no-store"})
  .then(res=>{
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  })
  .then(data=>{
    if (Array.isArray(data)) {
      CATALOG = data;
    } else if (data && Array.isArray(data.categorias)) {
      CATALOG = data.categorias;
    } else {
      throw new Error("Formato de JSON inesperado");
    }
    startCatalog();
  })
  .catch(err=>{
    console.warn("catalogo-zeneex.json não pôde ser carregado — usando dados embutidos.", err);
    CATALOG = CATALOG_FALLBACK;
    startCatalog();
  });
</script>
