<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zeneex — Curadoria de Inovação Global</title>
<meta name="description" content="Curadoria de Inovação Global. Toque em qualquer produto para solicitar orçamento direto no WhatsApp.">

<!-- Open Graph (WhatsApp, Instagram, Facebook, etc.) -->
<meta property="og:title" content="Zeneex — Curadoria de Inovação Global">
<meta property="og:description" content="Toque em qualquer produto para solicitar orçamento direto no WhatsApp.">
<meta property="og:image" content="https://zeneex.com.br/apple-touch-icon.png">
<meta property="og:url" content="https://zeneex.com.br/">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">

<!-- Twitter Card (usado como fallback por alguns apps) -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Zeneex — Curadoria de Inovação Global">
<meta name="twitter:description" content="Toque em qualquer produto para solicitar orçamento direto no WhatsApp.">
<meta name="twitter:image" content="https://zeneex.com.br/apple-touch-icon.png">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --petroleo:#0E3B3E;
    --petroleo-deep:#082426;
    --petroleo-soft: rgba(14,59,62,0.08);
    --paper:#EFF4F2;
    --card:#FCFCFA;
    --ink:#0F1E1D;
    --ink-soft:#4A5B59;
    --gold:#AD7F35;
    --gold-soft: rgba(173,127,53,0.12);
    --line: rgba(14,59,62,0.14);
    --line-strong: rgba(14,59,62,0.28);
    --radius: 2px;
    --wa-number: 5591984195397;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--petroleo);color:#fff;}

  /* ---------- Header ---------- */
  header.site{
    background-color:var(--petroleo);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/></svg>"),
      radial-gradient(ellipse 60% 50% at 18% 12%, rgba(255,255,255,0.09), transparent 55%),
      radial-gradient(ellipse 75% 65% at 82% 88%, rgba(4,20,21,0.65), transparent 62%),
      radial-gradient(ellipse 55% 55% at 62% 35%, rgba(255,255,255,0.04), transparent 50%),
      radial-gradient(ellipse 45% 60% at 10% 80%, rgba(4,20,21,0.45), transparent 58%);
    background-blend-mode:overlay, soft-light, normal, screen, normal;
    background-size:240px 240px, cover, cover, cover, cover;
    background-repeat:repeat, no-repeat, no-repeat, no-repeat, no-repeat;
    color:#fff;
    padding:22px 18px 18px;
    position:sticky;
    top:0;
    z-index:40;
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:flex-start;
  }
  .logo{
    display:flex;
    align-items:center;
  }
  .logo-img{
    height:26px;
    width:auto;
    display:block;
  }
  .tagline{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.03em;
    color:#fff;
    text-align:left;
  }
  .page-title-block{margin-top:18px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
  }
  h1.page-title{
    font-size:26px;
    margin:8px 0 4px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .page-sub{
    font-size:13px;
    color:rgba(255,255,255,0.72);
    margin:0;
    line-height:1.5;
  }

  /* ---------- Category nav ---------- */
  nav.catnav{
    position:sticky;
    top:0;
    z-index:39;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    white-space:nowrap;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:10px 14px;
  }
  /* subtle shadow to indicate nav pinned under header */
  nav.catnav{box-shadow:0 6px 14px -12px rgba(0,0,0,0.35);}
  nav.catnav::-webkit-scrollbar{display:none;}
  nav.catnav a{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.02em;
    padding:7px 12px;
    margin-right:6px;
    border:1px solid var(--line-strong);
    border-radius:20px;
    text-decoration:none;
    color:var(--petroleo);
    background:transparent;
  }
  nav.catnav a:hover{background:var(--petroleo-soft);}

  /* ---------- Filters ---------- */
  .filters{
    padding:16px 14px 6px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .filters .row{display:flex; gap:8px;}
  .search-wrap{
    position:relative;
    flex:1;
  }
  .search-wrap input{
    width:100%;
    padding:12px 14px 12px 38px;
    border:1px solid var(--line-strong);
    background:var(--card);
    border-radius:var(--radius);
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--petroleo);}
  .search-wrap svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; opacity:0.5;
  }
  select#priceFilter{
    border:1px solid var(--line-strong);
    background:var(--card);
    border-radius:var(--radius);
    padding:12px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink);
    outline:none;
    min-width:130px;
  }
  .result-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    padding:0 2px;
  }
  #emptyState{
    display:none;
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }

  /* ---------- Category sections ---------- */
  main{padding:8px 14px 0;}
  .category-section{
    padding-top:26px;
    scroll-margin-top:var(--sticky-offset, 200px);
  }
  .cat-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:14px;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }
  .cat-head h2{
    font-size:18px;
    font-weight:600;
    margin:0;
  }
  .cat-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .subcat-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:14px 0;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    padding:0;
    cursor:pointer;
    font:inherit;
    color:inherit;
    text-align:left;
  }
  .subcat-toggle .toggle-stub{
    align-self:stretch;
    width:26px;
    flex-shrink:0;
    background:var(--petroleo);
    background-image:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 7px);
  }
  .subcat-toggle .toggle-body{
    flex:1;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:10px;
    padding:13px 14px;
    min-width:0;
  }
  .subcat-toggle .toggle-thumb{
    width:92px;
    height:92px;
    flex-shrink:0;
    border-radius:2px;
    overflow:hidden;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .subcat-toggle .toggle-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .subcat-toggle .toggle-textrow{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .subcat-toggle .toggle-text{
    flex:1;
    min-width:0;
  }
  .subcat-toggle h3{
    font-size:15.5px;
    font-weight:600;
    margin:0 0 4px;
    color:var(--ink);
    text-transform:none;
    letter-spacing:normal;
    font-family:'Space Grotesk',system-ui,sans-serif;
  }
  .subcat-toggle .toggle-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .subcat-toggle .toggle-meta .n-modelos{
    color:var(--gold);
    letter-spacing:0.06em;
  }
  .subcat-toggle .chevron{
    width:26px;height:26px;
    border:1px solid var(--line-strong);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    color:var(--petroleo);
    font-size:13px;
    transition:transform .2s ease;
  }
  .subcat-toggle[aria-expanded="true"] .chevron{ transform:rotate(180deg); }
  .subcat-toggle[aria-expanded="true"]{ border-color:var(--line-strong); }

  /* compact variant: used for the inner "line" rows nested inside a family (e.g. generations inside iPhones) */
  .subcat-toggle.compact .toggle-body{
    flex-direction:row;
    align-items:center;
    gap:10px;
    padding:10px 12px;
  }
  .subcat-toggle.compact .toggle-thumb{
    width:56px;
    height:56px;
    aspect-ratio:unset;
    margin-bottom:0;
    flex-shrink:0;
  }
  .subcat-toggle.compact .toggle-textrow{
    flex:1;
    min-width:0;
  }
  .subcat-toggle.compact h3{
    font-size:14px;
  }

  .lines-list.collapsible{
    display:none;
  }
  .lines-list.collapsible.open{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:10px 0 4px;
    padding-left:12px;
    border-left:2px dashed var(--line-strong);
  }

  .grid.collapsible{
    display:none;
    margin-bottom:4px;
  }
  .grid.collapsible.open{
    display:grid;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
  }
  @media(min-width:620px){
    .grid{grid-template-columns:1fr 1fr;}
  }
  @media(min-width:980px){
    .grid{grid-template-columns:1fr 1fr 1fr;}
    main{padding:8px 28px 0;}
    .filters{padding:16px 28px 6px;}
    nav.catnav{padding:10px 28px;}
    header.site{padding:22px 28px 18px;}
  }

  /* ---------- Product card (access-card signature) ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    display:flex;
    overflow:hidden;
    position:relative;
  }
  .share-btn{
    position:absolute;
    top:8px;
    right:8px;
    width:36px;
    height:28px;
    background:transparent;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:20px;
    line-height:1;
    letter-spacing:1px;
    z-index:5;
    cursor:pointer;
    text-shadow:0 1px 3px rgba(0,0,0,0.7), 0 0 8px rgba(0,0,0,0.4);
  }
  .share-btn:active{ opacity:0.6; }

  .dots-menu{
    display:none;
    position:absolute;
    top:34px;
    right:14px;
    background:rgba(14,59,62,0.5);
    backdrop-filter:blur(10px) saturate(1.4);
    -webkit-backdrop-filter:blur(10px) saturate(1.4);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:10px;
    box-shadow:0 14px 30px rgba(0,0,0,0.25);
    overflow:hidden;
    width:186px;
    z-index:15;
  }
  .dots-menu.open{ display:block; }
  .dots-menu-item{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:12px 14px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:#fff;
    background:none;
    border:none;
    border-bottom:1px solid rgba(255,255,255,0.16);
    text-align:left;
    text-shadow:0 1px 2px rgba(0,0,0,0.4);
    cursor:pointer;
  }
  .dots-menu-item:last-child{ border-bottom:none; }

  .insight-panel{
    display:none;
    position:relative;
    margin:0 0 16px;
    background:rgba(14,59,62,0.9);
    backdrop-filter:blur(14px) saturate(1.3);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:10px;
    padding:20px 18px 22px;
    box-shadow:0 14px 34px rgba(0,0,0,0.22);
  }
  .insight-panel.open{ display:block; }
  .insight-close{
    position:absolute; top:12px; right:12px;
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.7);
    font-size:16px;
    background:none;
    border:none;
    border-radius:50%;
    cursor:pointer;
  }
  .insight-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:12px;
  }
  .insight-hook{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:17px;
    line-height:1.35;
    color:#fff;
    margin-bottom:10px;
    padding-right:20px;
  }
  .insight-intro{
    font-size:13.5px;
    line-height:1.55;
    color:rgba(255,255,255,0.85);
    margin-bottom:16px;
  }
  .insight-block{ margin-bottom:14px; }
  .insight-block:last-child{ margin-bottom:0; }
  .insight-block-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:#fff;
    margin-bottom:4px;
  }
  .insight-block-text{
    font-size:12.5px;
    line-height:1.55;
    color:rgba(255,255,255,0.72);
  }

  .subcat-toggle{ position:relative; scroll-margin-top:var(--sticky-offset, 200px); }
  .subcat-toggle .share-btn{
    top:8px;
    right:8px;
    color:var(--ink-soft);
    text-shadow:none;
  }
  .card{ scroll-margin-top:var(--sticky-offset, 200px); }
  .card .stub{
    width:40px;
    flex-shrink:0;
    background:var(--petroleo);
    background-image:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 7px);
    border-right:1px dashed rgba(255,255,255,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .card .stub .code{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    color:rgba(255,255,255,0.75);
    writing-mode:vertical-rl;
    text-orientation:mixed;
    letter-spacing:0.08em;
  }
  .card .stub::before,.card .stub::after{
    content:"";
    position:absolute;
    left:-6px;
    width:12px;height:12px;
    background:var(--paper);
    border-radius:50%;
  }
  .card .stub::before{top:-6px;}
  .card .stub::after{bottom:-6px;}

  .card .body{
    flex:1;
    padding:14px 14px 14px 16px;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .card .thumb{
    aspect-ratio:1/1;
    width:100%;
    border:1px dashed var(--line-strong);
    border-radius:var(--radius);
    background:
      repeating-linear-gradient(135deg, rgba(14,59,62,0.05) 0 2px, transparent 2px 10px);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:12px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-align:center;
    letter-spacing:0.02em;
    padding:8px;
    overflow:hidden;
  }
  .card .thumb.has-image{
    border-style:solid;
    background:var(--card);
    padding:0;
  }
  .card .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
  }
  .badges{display:flex; gap:6px; margin-bottom:8px;}
  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.08em;
    padding:3px 7px;
    border-radius:20px;
    text-transform:uppercase;
  }
  .badge.novo{background:var(--petroleo-soft); color:var(--petroleo);}
  .badge.seminovo{background:var(--gold-soft); color:var(--gold);}

  .card h3{
    font-size:15.5px;
    font-weight:600;
    margin:0 0 4px;
    line-height:1.28;
  }
  .spec{
    font-size:11.5px;
    color:var(--ink-soft);
    margin:0 0 10px;
    line-height:1.4;
  }

  .variations{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:12px;
  }
  .variations button{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:6px 10px;
    border:1px solid var(--line-strong);
    background:transparent;
    color:var(--ink);
    border-radius:20px;
    cursor:pointer;
  }
  .variations button.active{
    background:var(--petroleo);
    border-color:var(--petroleo);
    color:#fff;
  }

  .price-block{margin-top:auto; margin-bottom:12px;}
  .price-cash{
    font-family:'IBM Plex Mono',monospace;
    font-size:19px;
    font-weight:500;
    color:var(--ink);
  }
  .price-install{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .sim-toggle{
    display:inline-block;
    background:none;
    border:none;
    padding:0;
    margin:5px 0 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--petroleo);
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
  }
  .sim-panel{
    display:none;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    margin:0 0 12px;
  }
  .sim-panel.open{ display:block; }
  .sim-row{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:10px;
  }
  .sim-row label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .sim-row input,
  .sim-row select{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line-strong);
    border-radius:4px;
    background:var(--card);
    color:var(--ink);
  }
  .sim-result{
    border-top:1px dashed var(--line-strong);
    padding-top:10px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .sim-result .sim-parcela{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    font-weight:600;
    color:var(--petroleo);
  }
  .sim-result .sim-entrada-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  .cta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--petroleo);
    color:#fff;
    text-decoration:none;
    padding:11px 12px;
    border-radius:var(--radius);
    font-size:13px;
    font-weight:500;
    letter-spacing:0.01em;
    transition:background .15s ease;
  }
  .cta:hover{background:var(--petroleo-deep);}
  .cta svg{width:15px; height:15px; flex-shrink:0;}

  /* ---------- Footer ---------- */
  footer{
    margin-top:56px;
    padding:28px 20px 40px;
    text-align:center;
    border-top:1px solid var(--line);
  }
  footer p{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
    margin:0 0 16px;
  }
  .footer-social{
    display:flex;
    justify-content:center;
    gap:16px;
  }
  .footer-social a{
    display:flex;
    align-items:center;
    justify-content:center;
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid var(--line-strong);
    color:var(--ink-soft);
    text-decoration:none;
    transition:color .15s ease, border-color .15s ease;
  }
  .footer-social a:hover{
    color:var(--petroleo);
    border-color:var(--petroleo);

<script>
/* =========================================================
   DADOS DO CATÁLOGO
   Fonte compartilhada: catalogo-zeneex.json, o mesmo arquivo

   ("backup .json da Plataforma"). Editar preço/produto aqui

   O array abaixo é usado como FALLBACK automático apenas se
   o arquivo .json não puder ser carregado (ex: página aberta
   direto do disco, sem servidor).
========================================================= */
const CATALOG_FALLBACK = [];

let CATALOG = CATALOG_FALLBACK;
const CATALOG_JSON_URL = "./catalogo-zeneex.json";
const WA_NUMBER = "5591984195397";

/* =========================================================
   TRACKING
   Envie os cliques para o Google Analytics (GA4) assim que o
   Measurement ID estiver configurado — ver nota ao final do arquivo.
========================================================= */
function trackOrcamento(productName, variationLabel, price){
  const payload = {
    event: "solicitar_orcamento",
    product_name: productName,
    variation: variationLabel,
    price: price
  };
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push(payload);
  if (typeof gtag === "function"){
    gtag("event", "solicitar_orcamento", {
      item_name: productName,
      item_variant: variationLabel,
      value: price,
      currency: "BRL"
    });
  }
  console.log("[track] solicitar_orcamento", payload);
}

/* =========================================================
   HELPERS
========================================================= */
function slug(str){
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}
function fmtBRL(n){
  return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}

/* Taxas da maquininha por número de parcelas (mesma taxa Visa/Master) */
const RATE_TABLE = {
  1: 0.0359, 2: 0.0519, 3: 0.0599, 4: 0.0679, 5: 0.0759, 6: 0.0839,
  7: 0.0939, 8: 0.1019, 9: 0.1099, 10: 0.1179, 11: 0.1259, 12: 0.1339,
  13: 0.1419, 14: 0.1499, 15: 0.1579, 16: 0.1659, 17: 0.1739, 18: 0.1819
};

function roundPsych(raw){
  if (raw <= 0) return 0;
  const anchor = Math.floor(raw / 5) * 5;
  const diff = raw - anchor;
  if (anchor > 0 && diff < 1.0 - 1e-9){
    return +(anchor - 0.01).toFixed(2);
  }
  const startN = Math.max(0, Math.floor(raw) - 12);
  for (let n = startN; n <= Math.floor(raw) + 15; n++){
    const d = n % 10;
    if ((d===4||d===7||d===9) && (n + 0.99) >= raw - 1e-9){
      return +(n + 0.99).toFixed(2);
    }
  }
  return +raw.toFixed(2);
}

function simulateFinanciamento(cashPrice, entrada, parcelas){
  const restante = Math.max(cashPrice - (entrada || 0), 0);
  if (restante <= 0) return {parcela: 0, total: 0, restante: 0};
  const rate = RATE_TABLE[parcelas] || RATE_TABLE[12];
  const totalCartao = restante / (1 - rate);
  const rawParcela = totalCartao / parcelas;
  const parcela = roundPsych(rawParcela);
  return {parcela, total: +(parcela * parcelas).toFixed(2), restante};
}

function codeFor(catIndex, itemIndex){
  const cat = CATALOG[catIndex].category.replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,3) || "ZNX";
  return `ZNX-${cat}${String(itemIndex+1).padStart(2,"0")}`;
}
function lowestPrice(item){
  return Math.min(...item.variations.map(v=>v.cash));
}
function waLink(productName, variationLabel, simText){
  const suffix = variationLabel ? ` ${variationLabel}` : "";
  const simSuffix = simText ? `. ${simText}` : "";
  const msg = `Olá! Estava conferindo a Seleção da Zeneex e gostaria de um orçamento do ${productName}${suffix}${simSuffix}`;
  return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
}

const seenSupergroups = new Set();

    seenSupergroups.add(cat.supergroup);
    const a = document.createElement("a");
    a.href = `#super-${slug(cat.supergroup)}`;
    a.textContent = cat.supergroup;
    catnav.appendChild(a);
    return;
  }
  if (cat.group){
    if (seenGroups.has(cat.group)) return;
    seenGroups.add(cat.group);
    const a = document.createElement("a");
    a.href = `#group-${slug(cat.group)}`;
    a.textContent = cat.group;
    catnav.appendChild(a);
    return;
  }
  const a = document.createElement("a");
  a.href = `#cat-${slug(cat.category)}`;
  a.textContent = cat.category;
  catnav.appendChild(a);
});
}

  const simEntrada = simPanel.querySelector(".sim-entrada");
  const simParcelas = simPanel.querySelector(".sim-parcelas");
  const simEntradaLine = simPanel.querySelector(".sim-entrada-line");
  const simParcelaEl = simPanel.querySelector(".sim-parcela");
  let simUsed = false;

  function updateSim(){
    const cashNow = item.variations[currentIndex].cash;
    const entrada = parseFloat(simEntrada.value) || 0;
    const n = parseInt(simParcelas.value, 10);
    const r = simulateFinanciamento(cashNow, entrada, n);

    const n = parseInt(simParcelas.value, 10);
    if (entrada <= 0 && n === 12) return null;
    const r = simulateFinanciamento(cashNow, entrada, n);
    if (r.restante <= 0){
      return `Simulação: entrada de R$ ${fmtBRL(entrada)} cobre o valor total`;
    }
    if (entrada > 0){
      return `Simulação: entrada de R$ ${fmtBRL(entrada)} + ${n}x de R$ ${fmtBRL(r.parcela)}`;

  simEntrada.addEventListener("input", ()=>{ simUsed = true; updatePrice(); });

  const cta = document.createElement("a");

  attachImageShare(cta, ()=>item, ()=>item.variations[currentIndex], getSimInfo);

  let currentIndex = 0;

  function isRealLabel(label){
    return label && label.trim().toLowerCase() !== "padrão";
  }

  function updatePrice(){
    const v = item.variations[currentIndex];
    priceCash.textContent = "R$ " + fmtBRL(v.cash);
    priceInstall.textContent = `ou ${v.instCount || 12}x de R$ ${fmtBRL(v.inst)}`;
    cta.href = waLink(item.name, (item.variations.length > 1 || isRealLabel(v.label)) ? v.label : "", getSimText());
    cta.onclick = ()=> trackOrcamento(item.name, v.label, v.cash);
    if (simPanel.classList.contains("open")) updateSim();
  }

  if (item.variations.length > 1){
    item.variations.forEach((v, vi)=>{
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = v.label;
      if (vi === 0) btn.classList.add("active");
      btn.addEventListener("click", ()=>{
        currentIndex = vi;
        variationsWrap.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        updatePrice();
      });
      variationsWrap.appendChild(btn);
    });
  } else if (isRealLabel(item.variations[0].label)){
    const staticChip = document.createElement("button");
    staticChip.type = "button";
    staticChip.className = "active";
    staticChip.textContent = item.variations[0].label;

  updatePrice();

  if (badges.childElementCount) body.appendChild(badges);

  return card;

function buildToggleUnit(title, items, hideMeta, shareHash){
  const toggle = document.createElement("button");
  toggle.type = "button";

  if (shareHash) toggle.id = shareHash;

  const leadItem = items[0];
  const thumbHtml = leadItem.image
    ? `<span class="toggle-thumb"><img src="${leadItem.image}" alt="${leadItem.name}" loading="lazy"></span>`
    : "";

  const metaHtml = hideMeta
    ? ""
    : `<span class="toggle-meta"><span class="n-modelos">${items.length} ${items.length===1?"MODELO":"MODELOS"}</span> · a partir de R$ ${fmtBRL(Math.min(...items.flatMap(it => it.variations.map(v => v.cash))))}</span>`;

  toggle.innerHTML = `
    <span class="toggle-stub"></span>
    <span class="toggle-body">
      ${thumbHtml}
      <span class="toggle-textrow">
        <span class="toggle-text">
          <h3>${title}</h3>
          ${metaHtml}
        </span>
        <span class="chevron">⌄</span>
      </span>
    </span>
  `;

  if (shareHash){
    const shareBtn = document.createElement("button");
    shareBtn.type = "button";
    shareBtn.className = "share-btn";
    shareBtn.setAttribute("aria-label", "Compartilhar");
    shareBtn.textContent = "⋯";
    shareBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      shareWithPhoto(title, `#${shareHash}`, leadItem, leadItem.variations[0], items);
    });
    toggle.appendChild(shareBtn);
  }

  return toggle;
}

function buildGroupBlock(groupCats, idOverride){
  const groupName = groupCats[0].group;
  const allItems = groupCats.flatMap(c => c.items);

  const linesContainer = document.createElement("div");
  linesContainer.className = "lines-list collapsible";

  groupCats.forEach((subCat)=>{
    const lineToggle = buildToggleUnit(subCat.category, subCat.items, false, `line-${slug(subCat.category)}`);
    const grid = document.createElement("div");
    grid.className = "grid collapsible";
    const catIndex = CATALOG.indexOf(subCat);
    subCat.items.forEach((item, ii)=> grid.appendChild(buildCard(item, catIndex, ii)));

    lineToggle.addEventListener("click", (e)=>{
      if (e.target.closest(".share-btn")) return;
      const isOpen = grid.classList.toggle("open");
      lineToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });

    linesContainer.appendChild(lineToggle);
    linesContainer.appendChild(grid);
  });

  familyToggle.addEventListener("click", (e)=>{
    if (e.target.closest(".share-btn")) return;
    const isOpen = linesContainer.classList.toggle("open");
    familyToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });

  return {toggle: familyToggle, content: linesContainer, items: allItems};
}

function buildFlatMultiBlock(cat, idOverride){
  const toggle = buildToggleUnit(cat.category, cat.items, false, idOverride || `cat-${slug(cat.category)}-toggle`);
  const grid = document.createElement("div");
  grid.className = "grid collapsible";
  const catIndex = CATALOG.indexOf(cat);
  cat.items.forEach((item, ii)=> grid.appendChild(buildCard(item, catIndex, ii)));

  toggle.addEventListener("click", (e)=>{
    if (e.target.closest(".share-btn")) return;
    const isOpen = grid.classList.toggle("open");
    toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });

  return {toggle, content: grid, items: cat.items};
}

function buildSingleBlock(cat, idOverride){
  const toggle = buildToggleUnit(cat.items[0].name, cat.items, true, idOverride || `cat-${slug(cat.category)}-toggle`);
  const grid = document.createElement("div");
  grid.className = "grid collapsible";
  const catIndex = CATALOG.indexOf(cat);
  grid.appendChild(buildCard(cat.items[0], catIndex, 0));

  toggle.addEventListener("click", (e)=>{
    if (e.target.closest(".share-btn")) return;
    const isOpen = grid.classList.toggle("open");
    toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });

  return {toggle, content: grid, items: cat.items};
}

function renderSections(){
const renderedGroups = new Set();
const renderedSupergroups = new Set();

CATALOG.forEach((cat, ci)=>{
  if (cat.supergroup){
    if (renderedSupergroups.has(cat.supergroup)) return;
    renderedSupergroups.add(cat.supergroup);

    const seenSub = new Set();
    const subBlocks = [];
    let totalItems = 0;
    let leadItems = [];

    CATALOG.forEach((c2)=>{
      if (c2.supergroup !== cat.supergroup) return;
      const subKey = c2.group || c2.category;
      if (seenSub.has(subKey)) return;
      seenSub.add(subKey);

      let block;
      if (c2.group){
        const gcats = CATALOG.filter(x=>x.group === c2.group);
        block = buildGroupBlock(gcats, `sub-${slug(subKey)}`);
      } else if (c2.items.length > 1){
        block = buildFlatMultiBlock(c2, `sub-${slug(subKey)}`);
      } else {
        block = buildSingleBlock(c2, `sub-${slug(subKey)}`);
      }
      totalItems += block.items.length;
      leadItems = leadItems.concat(block.items);
      subBlocks.push(block);
    });

    const section = document.createElement("section");
    section.className = "category-section";
    section.id = `super-${slug(cat.supergroup)}`;

    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `<h2>${cat.supergroup}</h2><span class="cat-count mono">${totalItems} itens</span>`;
    section.appendChild(head);

    const outerToggle = buildToggleUnit(cat.supergroup, leadItems, false, `super-${slug(cat.supergroup)}-toggle`);
    const outerContainer = document.createElement("div");
    outerContainer.className = "lines-list collapsible";
    subBlocks.forEach(b=>{
      outerContainer.appendChild(b.toggle);
      outerContainer.appendChild(b.content);
    });

    outerToggle.addEventListener("click", (e)=>{
      if (e.target.closest(".share-btn")) return;
      const isOpen = outerContainer.classList.toggle("open");
      outerToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });

    section.appendChild(outerToggle);
    section.appendChild(outerContainer);
    main.appendChild(section);
    return;
  }

  if (cat.group){
    if (renderedGroups.has(cat.group)) return;
    renderedGroups.add(cat.group);
    const groupCats = CATALOG.filter(c=>c.group === cat.group);
    const totalItems = groupCats.reduce((sum,c)=>sum + c.items.length, 0);

    const section = document.createElement("section");
    section.className = "category-section";
    section.id = `group-${slug(cat.group)}`;

    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `<h2>${cat.group}</h2><span class="cat-count mono">${totalItems} ${totalItems===1?"item":"itens"}</span>`;
    section.appendChild(head);

    const block = buildGroupBlock(groupCats);
    section.appendChild(block.toggle);
    section.appendChild(block.content);

    main.appendChild(section);
    return;
  }

  if (cat.items.length > 1){
    const section = document.createElement("section");
    section.className = "category-section";
    section.id = `cat-${slug(cat.category)}`;

    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `<h2>${cat.category}</h2><span class="cat-count mono">${cat.items.length} itens</span>`;
    section.appendChild(head);

    const block = buildFlatMultiBlock(cat);
    section.appendChild(block.toggle);
    section.appendChild(block.content);
    main.appendChild(section);
    return;
  }

  const section = document.createElement("section");
  section.className = "category-section";
  section.id = `cat-${slug(cat.category)}`;

  const head = document.createElement("div");
  head.className = "cat-head";
  head.innerHTML = `<h2>${cat.category}</h2><span class="cat-count mono">1 item</span>`;
  section.appendChild(head);

  const block = buildSingleBlock(cat);
  section.appendChild(block.toggle);
  section.appendChild(block.content);
  main.appendChild(section);
});
}

/* =========================================================
   FILTER / SEARCH
========================================================= */
const searchInput = document.getElementById("searchInput");
const priceFilter = document.getElementById("priceFilter");
const allCards = ()=> Array.from(document.querySelectorAll(".card"));
const allSections = ()=> Array.from(document.querySelectorAll(".category-section"));

function applyFilters(){
  const term = searchInput.value.trim().toLowerCase();
  const range = priceFilter.value;
  let [min, max] = range === "all" ? [0, Infinity] : range.split("-").map(Number);

  let visibleTotal = 0;

  allSections().forEach(section=>{
    let visibleInSection = 0;
    section.querySelectorAll(".card").forEach(card=>{
      const nameMatch = !term || card.dataset.name.includes(term);
      const price = Number(card.dataset.price);
      const priceMatch = price >= min && price <= max;
      const show = nameMatch && priceMatch;
      card.style.display = show ? "" : "none";
      if (show){ visibleInSection++; visibleTotal++; }
    });
    section.style.display = visibleInSection ? "" : "none";
  });

  resultCount.textContent = `${visibleTotal} produto${visibleTotal===1?"":"s"} encontrado${visibleTotal===1?"":"s"}`;
  emptyState.style.display = visibleTotal === 0 ? "block" : "none";
}

searchInput.addEventListener("input", applyFilters);
priceFilter.addEventListener("change", applyFilters);

/* =========================================================
   CARREGAMENTO DO CATÁLOGO
========================================================= */
function updateStickyOffset(){
  const header = document.querySelector("header.site");
  if (header) {
    document.documentElement.style.setProperty("--sticky-offset", (header.offsetHeight + 16) + "px");
  }
}

function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawImageCover(ctx, img, x, y, w, h){
  const ir = img.width/img.height, tr = w/h;
  let sx=0, sy=0, sw=img.width, sh=img.height;
  if (ir > tr){ sw = img.height*tr; sx = (img.width-sw)/2; }
  else { sh = img.width/tr; sy = (img.height-sh)/2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function loadImageEl(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function wrapCanvasText(ctx, text, maxWidth){
  const words = text.split(" ");
  const lines = [];
  let line = "";
  for (const w of words){
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function drawStoryBackground(ctx, W, H){
  ctx.fillStyle = "#0E3B3E";
  ctx.fillRect(0, 0, W, H);
  function radial(cx, cy, r, c1, c2, op){
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, c1);
    g.addColorStop(1, c2);
    ctx.globalCompositeOperation = op;
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
  }
  radial(W*0.15, H*0.08, W*0.6, "rgba(255,255,255,0.12)", "rgba(255,255,255,0)", "lighter");
  radial(W*0.9, H*0.95, W*0.7, "rgba(4,20,21,0.75)", "rgba(4,20,21,0)", "multiply");
  radial(W*0.05, H*0.85, W*0.55, "rgba(4,20,21,0.55)", "rgba(4,20,21,0)", "multiply");
}
async function loadStoryFonts(){
  await Promise.all([
    document.fonts.load("700 64px 'Space Grotesk'"),
    document.fonts.load("500 56px 'IBM Plex Mono'"),
    document.fonts.load("400 30px 'Inter'"),
    document.fonts.load("600 22px 'IBM Plex Mono'"),
    document.fonts.load("400 26px 'IBM Plex Mono'"),
  ]).catch(()=>{});
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
}
async function drawStoryShell(ctx, W, photoSrc, title, badgeText){
  const logoImg = await loadImageEl("logo-zeneex.png").catch(()=>null);
  if (logoImg){
    const lh = 64, lw = lh * (logoImg.width/logoImg.height);
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.5)";
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 6;
    ctx.drawImage(logoImg, (W-lw)/2, 210, lw, lh);
    ctx.restore();
  }

  const photoImg = photoSrc ? await loadImageEl(photoSrc).catch(()=>null) : null;
  const px = 90, py = 380, pw = W - px*2, ph = 820;
  ctx.save();
  roundRectPath(ctx, px, py, pw, ph, 24);
  ctx.clip();
  ctx.shadowColor = "rgba(0,0,0,0.5)";
  ctx.shadowBlur = 60;
  if (photoImg) drawImageCover(ctx, photoImg, px, py, pw, ph);
  else { ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fillRect(px, py, pw, ph); }
  ctx.restore();

  let y = py + ph + 60;
  if (badgeText){
    ctx.font = "600 22px 'IBM Plex Mono'";
    const bw = ctx.measureText(badgeText).width + 44;
    ctx.fillStyle = "rgba(252,252,250,0.14)";
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 1;
    roundRectPath(ctx, px, y, bw, 46, 20);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.textBaseline = "middle";
    ctx.fillText(badgeText, px+22, y+23);
    ctx.textBaseline = "alphabetic";
    y += 46 + 30;
  } else {
    y += 10;
  }

  const measure = document.createElement("canvas").getContext("2d");
  measure.font = "700 64px 'Space Grotesk'";
  const titleLines = wrapCanvasText(measure, title, W - px*2);
  ctx.fillStyle = "#fff";
  ctx.font = "700 64px 'Space Grotesk'";
  ctx.shadowColor = "rgba(0,0,0,0.85)";
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 2;
  titleLines.forEach((line, i)=> ctx.fillText(line, px, y + 54 + i*70));
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  y += titleLines.length * 70 + 20;

  return {y, px};
}
function drawStoryFooter(ctx, W, H){
  ctx.font = "400 26px 'IBM Plex Mono'";
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.textAlign = "center";
  ctx.shadowColor = "rgba(0,0,0,0.7)";
  ctx.shadowBlur = 8;
  ctx.fillText("zeneex.com.br", W/2, H - 120);
  ctx.shadowBlur = 0;
  ctx.textAlign = "left";
}

async function buildCardCanvas(item, variation, simInfo){
  await loadStoryFonts();
  const W = 1080, H = 1920, scale = 1.5;
  const canvas = document.createElement("canvas");
  canvas.width = W*scale; canvas.height = H*scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  drawStoryBackground(ctx, W, H);

  const hasLabel = variation.label && variation.label.trim().toLowerCase() !== "padrão";
  const badgeText = [item.badge, hasLabel ? variation.label : null].filter(Boolean).join(" · ");
  const {y, px} = await drawStoryShell(ctx, W, item.image, item.displayName || item.name, badgeText);

  const hasSim = simInfo && (simInfo.entrada > 0 || simInfo.n !== 12);
  let py2 = y + 10;
  ctx.shadowColor = "rgba(0,0,0,0.85)"; ctx.shadowBlur = 8;
  if (hasSim && simInfo.entrada > 0){
    ctx.font = "400 30px 'Inter'";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fillText(`Entrada: R$ ${fmtBRL(simInfo.entrada)}`, px, py2 + 26);
    py2 += 50;
  }
  ctx.fillStyle = "#fff";
  ctx.font = "500 56px 'IBM Plex Mono'";
  if (hasSim){
    ctx.fillText(`${simInfo.n}x de R$ ${fmtBRL(simInfo.parcela)}`, px, py2 + 46);
  } else {
    ctx.fillText("R$ " + fmtBRL(variation.cash), px, py2 + 46);
    ctx.font = "400 30px 'Inter'";
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.fillText(`ou ${variation.instCount||12}x de R$ ${fmtBRL(variation.inst)}`, px, py2 + 90);
  }
  ctx.shadowBlur = 0;

  drawStoryFooter(ctx, W, H);
  return canvas;
}

async function buildGroupCanvas(title, items){
  await loadStoryFonts();
  const W = 1080, H = 1920, scale = 1.5;
  const canvas = document.createElement("canvas");
  canvas.width = W*scale; canvas.height = H*scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  drawStoryBackground(ctx, W, H);

  const leadItem = items[0];
  const count = items.length;
  const lowest = Math.min(...items.flatMap(it => it.variations.map(v => v.cash)));
  const badgeText = count > 1 ? `${count} MODELOS` : null;
  const {y, px} = await drawStoryShell(ctx, W, leadItem.image, title, badgeText);

  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.font = "400 30px 'Inter'";
  ctx.shadowColor = "rgba(0,0,0,0.85)"; ctx.shadowBlur = 8;
  ctx.fillText("a partir de", px, y + 30);
  ctx.fillStyle = "#fff";
  ctx.font = "500 56px 'IBM Plex Mono'";
  ctx.fillText("R$ " + fmtBRL(lowest), px, y + 90);
  ctx.shadowBlur = 0;

  drawStoryFooter(ctx, W, H);
  return canvas;
}

function attachImageShare(cta, getItem, getVariation, getSimInfo){
  cta.addEventListener("click", function(e){
    if (!navigator.share) return;
    e.preventDefault();
    const waHref = cta.href;
    const item = getItem();
    const simInfo = getSimInfo ? getSimInfo() : null;
    (async ()=>{
      try{
        const canvas = await buildCardCanvas(item, getVariation(), simInfo);
        const blob = await new Promise(res => canvas.toBlob(res, "image/png", 0.95));
        if (blob && navigator.canShare){
          const file = new File([blob], "zeneex-produto.png", {type:"image/png"});
          if (navigator.canShare({files:[file]})){
            const intent = simInfo ? "gostaria de saber mais" : "gostaria de um orçamento";
            const shortText = `Olá! Estava conferindo a Seleção da Zeneex e ${intent} do ${item.displayName || item.name}`;
            await navigator.share({files:[file], text: shortText});
            return;
          }
        }
        window.open(waHref, "_blank");
      } catch(err){
        if (err && err.name === "AbortError") return;
        window.open(waHref, "_blank");
      }
    })();
  });
}

function shareWithPhoto(title, hash, leadItem, leadVariation, groupItems){
  const url = location.origin + location.pathname + hash;
  if (navigator.share){
    (async ()=>{
      try{
        if (leadItem && leadItem.image && navigator.canShare){
          const canvas = groupItems
            ? await buildGroupCanvas(title, groupItems)
            : await buildCardCanvas(leadItem, leadVariation || leadItem.variations[0]);
          const blob = await new Promise(res => canvas.toBlob(res, "image/png", 0.95));
          if (blob){
            const file = new File([blob], "zeneex-produto.png", {type:"image/png"});
            if (navigator.canShare({files:[file]})){
              await navigator.share({files:[file], text: `Confira: ${title} — ${url}`});
              return;
            }
          }
        }
        await navigator.share({title: `Zeneex — ${title}`, text: `Confira: ${title}`, url});
      } catch(err){
        if (err && err.name === "AbortError") return;
      }
    })();
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>{
      alert("Link copiado! Cole onde quiser compartilhar.");
    }).catch(()=>{
      window.prompt("Copie o link abaixo:", url);
    });
    return;
  }
  window.prompt("Copie o link abaixo:", url);
}

function shareLink(title, hash){
  const url = location.origin + location.pathname + hash;
  const shareData = {title: `Zeneex — ${title}`, text: `Confira: ${title}`, url};
  if (navigator.share){
    navigator.share(shareData).catch(()=>{});
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>{
      alert("Link copiado! Cole onde quiser compartilhar.");
    }).catch(()=>{
      window.prompt("Copie o link abaixo:", url);
    });
    return;
  }
  window.prompt("Copie o link abaixo:", url);
}

function revealAndScroll(el){
  let node = el.parentElement;
  while (node && node !== document.body){
    if (node.classList && node.classList.contains("collapsible") && !node.classList.contains("open")){
      const toggle = node.previousElementSibling;
      if (toggle && toggle.classList && toggle.classList.contains("subcat-toggle")){
        toggle.click();
      }
    }
    node = node.parentElement;
  }
  if (el.classList && el.classList.contains("subcat-toggle") && el.getAttribute("aria-expanded") !== "true"){
    el.click();
  }
  const ownToggle = el.querySelector(":scope > .subcat-toggle");
  if (ownToggle && ownToggle.getAttribute("aria-expanded") !== "true"){
    ownToggle.click();
  }
  setTimeout(()=>{ el.scrollIntoView({behavior:"smooth", block:"start"}); }, 60);
}

function handleShareHash(){
  if (!location.hash || location.hash.length < 2) return;
  const id = location.hash.slice(1);
  const el = document.getElementById(id);
  if (el) revealAndScroll(el);
}

function startCatalog(){
  renderNav();
  renderSections();
  applyFilters();
  updateStickyOffset();
  window.addEventListener("resize", updateStickyOffset);
  setTimeout(handleShareHash, 120);
  window.addEventListener("hashchange", handleShareHash);
}

fetch(CATALOG_JSON_URL, {cache:"no-store"})
  .then(res=>{
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  })
  .then(data=>{
    if (Array.isArray(data)) {
      CATALOG = data;
    } else if (data && Array.isArray(data.categorias)) {
      CATALOG = data.categorias;
    } else {
      throw new Error("Formato de JSON inesperado");
    }
    startCatalog();
  })
  .catch(err=>{
    console.warn("catalogo-zeneex.json não pôde ser carregado — usando dados embutidos.", err);
    CATALOG = CATALOG_FALLBACK;
    startCatalog();
  });
